# Builds multi-arch images once, pushes them to GHCR, signs them keylessly
# with cosign (identity: this workflow) and attaches build provenance and an
# SBOM. Manual or on a version tag; runs in the protected "release"
# environment. Nothing here has AWS access: deployment pins the digests this
# workflow prints (scripts/aws/deploy.sh).
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write       # push to ghcr.io/<owner>
      id-token: write       # keyless signing and provenance (OIDC)
      attestations: write
    strategy:
      matrix:
        include:
          - {name: expenses, dockerfile: services/expenses/Dockerfile}
          - {name: audit, dockerfile: services/audit/Dockerfile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/expense-platform-${{ matrix.name }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with: {cosign-release: v3.1.4}
      - name: Sign (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/expense-platform-${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/expense-platform-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Digest for deployment
        run: echo "ghcr.io/${{ github.repository_owner }}/expense-platform-${{ matrix.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
