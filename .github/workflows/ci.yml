# Pull request and main-branch checks. Runs on GitHub-hosted (ephemeral)
# runners with a read-only token and no secrets: pull requests from forks get
# exactly the same, so nothing here can leak cloud credentials. Third-party
# actions are pinned by commit SHA; tools by version or image digest (Makefile).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go (format, vet, unit tests, vulnerabilities, SAST)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: libs/platform/go.mod
          cache-dependency-path: "**/go.sum"
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: make vuln
      - run: make sast
      - run: make fuzz FUZZTIME=10s

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: libs/platform/go.mod
          cache-dependency-path: "**/go.sum"
      - run: make test-integration

  infrastructure:
    name: Kubernetes manifests and Terraform (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: libs/platform/go.mod
          cache-dependency-path: "**/go.sum"
      - run: make gha-lint
      - run: make api-lint
      - run: make k8s-lint
      - run: make tf-fmt
      - run: make tf-validate
      - name: Provider lock file is committed and current
        run: git diff --exit-code -- infra/terraform/aws/.terraform.lock.hcl
      - run: make tf-lint
      - run: make tf-scan

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - run: make secrets-scan

  images:
    name: Images (build, scan, SBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: make image-scan
      - name: SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          for n in expenses audit devidp; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
              image --quiet --format cyclonedx "expense-platform/$n:scan" > "sbom/$n.cdx.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 30

  e2e:
    name: End-to-end on kind (NetworkPolicy-enforcing)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [go, integration]
    env:
      KIND_CLUSTER: ci
      KUBE_CONTEXT: kind-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: libs/platform/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Create kind cluster
        run: go run sigs.k8s.io/kind@v0.33.0 create cluster --name ci --wait 120s
      - run: ./scripts/deploy-local.sh
      - run: make verify-cluster
      - run: make e2e
      - run: ./scripts/demo.sh
      - run: make backup && make restore-check
      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context kind-ci -n expense-platform-local get all,events
          kubectl --context kind-ci -n expense-platform-local logs -l app.kubernetes.io/part-of=expense-platform --all-containers --tail=200
