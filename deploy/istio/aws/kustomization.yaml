apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: expense-platform
resources:
  - ../local
patches:
  - target:
      kind: AuthorizationPolicy
      name: audit-8081-expenses-only
    patch: |-
      - op: replace
        path: /spec/rules/0/from/0/source/notPrincipals/0
        value: cluster.local/ns/expense-platform/sa/expenses
