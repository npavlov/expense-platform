# Single-node k3s on EC2 (infra/terraform/aws). Deployed by
# scripts/deploy-aws.sh, which overrides the placeholders below with
# Terraform outputs and image digests in a generated kustomization under
# .local/ (never committed). Rendering this directory as-is is safe: the
# placeholders point nowhere.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: expense-platform

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - networkpolicies.yaml

configMapGenerator:
  - name: auth-config
    literals:
      # Cognito user pool issuer and app client; replaced at deploy time.
      - AUTH_ISSUER=https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_PLACEHOLDER
      - AUTH_CLIENT_IDS=placeholder-client-id

images:
  # Published by .github/workflows/release.yml; deploy pins them by digest.
  - {name: expense-platform/expenses, newName: ghcr.io/npavlov/expense-platform-expenses, digest: sha256:6af714878784691d7705bf8f24bc2a6eb12bc2b45f346e6298603d1c34b382f9}
  - {name: expense-platform/audit, newName: ghcr.io/npavlov/expense-platform-audit, newTag: placeholder}

patches:
  - target: {kind: StatefulSet, name: postgres}
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
  # Public API traffic only from the Traefik ingress controller.
  - target: {kind: NetworkPolicy, name: public-api-ingress}
    patch: |-
      - op: add
        path: /spec/ingress/0/from
        value:
          - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
            podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
