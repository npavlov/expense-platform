# Each alert names the action to take; see docs/operations.md.
groups:
  - name: expense-platform
    rules:
      - alert: OutboxDeliveryStalled
        # Decisions are made but the audit trail is not catching up.
        expr: max(outbox_oldest_undelivered_age_seconds) > 30
        for: 15s
        labels: {severity: page}
        annotations:
          summary: "Oldest undelivered ExpenseDecided event is {{ $value | humanizeDuration }} old"
          runbook: "docs/operations.md#outboxdeliverystalled"
      - alert: OutboxEventsParked
        expr: max(outbox_events_parked) > 0
        for: 1m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value }} outbox events need an operator (parked)"
          runbook: "docs/operations.md#outboxeventsparked"
      - alert: ApiErrorRateHigh
        expr: |
          sum(rate(http_requests_total{server="public",code=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{server="public"}[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "More than 5% of public API requests fail with 5xx"
          runbook: "docs/operations.md#apierrorratehigh"
      - alert: AuditIngestRejectedSignatures
        expr: increase(audit_events_received_total{result="unauthenticated"}[10m]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "audit rejected events with invalid signatures (key mismatch or spoofing attempt)"
          runbook: "docs/operations.md#auditingestrejectedsignatures"
