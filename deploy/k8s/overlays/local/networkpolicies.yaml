# Token verification keys come from devidp inside the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: jwks-egress-local}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [expenses, audit]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: devidp}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: devidp-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: devidp}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 8080}]
