# Shared manifests for every environment. Overlays add the namespace,
# environment config, image references and exposure (NodePort vs Ingress).
# Secrets are not here: scripts/secrets.sh generates them outside Git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: expense-platform
    includeSelectors: false

resources:
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - jobs/db-bootstrap.yaml
  - jobs/migrations.yaml
  - expenses/deployment.yaml
  - expenses/service.yaml
  - audit/deployment.yaml
  - audit/service.yaml
  - serviceaccounts.yaml
  - networkpolicies.yaml

configMapGenerator:
  - name: db-bootstrap-sql
    files:
      - db/bootstrap.sql

images:
  - name: expense-platform/expenses
  - name: expense-platform/audit
