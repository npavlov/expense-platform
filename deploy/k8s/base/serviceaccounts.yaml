# One identity per workload. None of them talks to the Kubernetes API, so no
# Role/RoleBinding exists and the token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: expenses}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: audit}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: db-jobs}
automountServiceAccountToken: false
