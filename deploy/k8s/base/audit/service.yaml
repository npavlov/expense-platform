# Public history API (routed by the ingress in AWS) and metrics.
apiVersion: v1
kind: Service
metadata:
  name: audit
  labels: {app.kubernetes.io/name: audit}
spec:
  selector: {app.kubernetes.io/name: audit}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: metrics, port: 9090, targetPort: metrics}
---
# Internal event ingestion. Separate Service so no ingress rule can point at
# it by accident; NetworkPolicy admits only expenses pods.
apiVersion: v1
kind: Service
metadata:
  name: audit-internal
  labels: {app.kubernetes.io/name: audit}
spec:
  selector: {app.kubernetes.io/name: audit}
  ports:
    - {name: internal, port: 8081, targetPort: internal}
