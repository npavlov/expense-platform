apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  labels: {app.kubernetes.io/name: audit}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: audit}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: audit, app.kubernetes.io/component: api, expense-platform/db-client: "true"}
    spec:
      serviceAccountName: audit
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532  # secret files are mode 0440, group-readable by the pod only
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: audit
          image: expense-platform/audit
          envFrom:
            - configMapRef: {name: auth-config}
          env:
            - {name: DATABASE_URL_FILE, value: /var/run/secrets/expense-platform/db/url}
            - {name: INGEST_SIGNING_KEYS_FILE, value: /var/run/secrets/expense-platform/signing/keys}
          ports:
            - {name: http, containerPort: 8080}
            - {name: internal, containerPort: 8081}
            - {name: metrics, containerPort: 9090}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: db, mountPath: /var/run/secrets/expense-platform/db, readOnly: true}
            - {name: signing, mountPath: /var/run/secrets/expense-platform/signing, readOnly: true}
      volumes:
        - name: db
          secret: {secretName: audit-app-db, defaultMode: 0440}
        - name: signing
          secret: {secretName: audit-ingest-keys, defaultMode: 0440}
