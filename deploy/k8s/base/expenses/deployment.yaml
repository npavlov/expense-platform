apiVersion: apps/v1
kind: Deployment
metadata:
  name: expenses
  labels: {app.kubernetes.io/name: expenses}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: expenses}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: expenses, app.kubernetes.io/component: api, expense-platform/db-client: "true"}
    spec:
      serviceAccountName: expenses
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532  # secret files are mode 0440, group-readable by the pod only
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: expenses
          image: expense-platform/expenses
          envFrom:
            - configMapRef: {name: auth-config}
            - configMapRef: {name: expenses-config, optional: true}
          env:
            - {name: DATABASE_URL_FILE, value: /var/run/secrets/expense-platform/db/url}
            - {name: AUDIT_EVENTS_URL, value: "http://audit-internal:8081/internal/v1/events"}
            - {name: AUDIT_SIGNING_KEY_ID_FILE, value: /var/run/secrets/expense-platform/signing/id}
            - {name: AUDIT_SIGNING_KEY_FILE, value: /var/run/secrets/expense-platform/signing/key}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
            # The admin listener (127.0.0.1:9091) is intentionally not declared:
            # it is reachable only with kubectl port-forward.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: db, mountPath: /var/run/secrets/expense-platform/db, readOnly: true}
            - {name: signing, mountPath: /var/run/secrets/expense-platform/signing, readOnly: true}
      volumes:
        - name: db
          secret: {secretName: expenses-app-db, defaultMode: 0440}
        - name: signing
          secret: {secretName: outbox-signing-key, defaultMode: 0440}
